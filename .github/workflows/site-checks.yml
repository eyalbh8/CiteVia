name: Site checks
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build-and-crawl:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        indexable: ['true', 'false']
    env:
      SITE_URL: https://citevia.io
      SITE_INDEXABLE: ${{ matrix.indexable }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:seo
